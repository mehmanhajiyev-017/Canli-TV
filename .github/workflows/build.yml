name: Canli TV APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Qurasdir
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stabil Gradle 8.2 Qurasdir
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # Восстанавливаем строго один и тот же постоянный ключ подписи
      - name: Sabit Debug Keystore Berpa Et
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore || true
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
          fi

      - name: APK Derle
        run: gradle assembleDebug -PautoVersionCode=${{ github.run_number }} --no-daemon

      - name: APK Adini Hazirla
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/app-debug.apk final_apk/app-release.apk

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: final_apk/app-release.apk
