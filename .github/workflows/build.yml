name: Build TV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Quraşdır və APK Derle
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Adı tvapp.apk olaraq dəyişdir
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/tvapp.apk

      - name: tvapp.apk Yüklə (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tvapp
          path: app/build/outputs/apk/debug/tvapp.apk
