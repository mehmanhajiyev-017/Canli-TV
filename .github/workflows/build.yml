name: Canli TV APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çək
        uses: actions/checkout@v4

      - name: Java 17 Quraşdır
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sabit Gradle Quraşdır
        uses: gradle/actions/setup-gradle@v3

      - name: Sabit Debug Keystore Bərpa Et
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | tr -d '\r\n ' | base64 -d > ~/.android/debug.keystore
          else
            echo "Keystore secret-i boşdur, standart açar yaradılır..."
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: İcazə Ver (Gradlew)
        run: chmod +x gradlew

      - name: APK Dərlə
        run: ./gradlew assembleDebug --stacktrace

      - name: APK Yüklə (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Canli-TV-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
