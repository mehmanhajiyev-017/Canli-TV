name: Canli TV APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Qurasdir
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stabil Gradle 8.2 Qurasdir
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: APK Derle
        run: gradle assembleDebug -PautoVersionCode=${{ github.run_number }} --no-daemon

      # Faylın adını avtomatik app-release.apk olaraq dəyişir
      - name: APK Adini Hazirla
        run: |
          mkdir -p final_apk
          cp app/build/outputs/apk/debug/app-debug.apk final_apk/app-release.apk

      # Avtomatik hazır adla yükləyir
      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: final_apk/app-release.apk
