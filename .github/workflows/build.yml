name: Canli TV APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Проверка структуры файлов
        run: ls -la

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Восстановление Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | tr -d '\r\n ' | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Сборка APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Загрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Canli-TV-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
