name: Build TV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Wrappper Yoxla və İcazə Ver
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: APK Derle (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon

      - name: tvapp.apk Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tvapp
          path: app/build/outputs/apk/debug/*.apk
