name: Canli TV APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Qurasdir
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stabil Gradle 8.2 Qurasdir
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: APK Derle
        run: gradle assembleDebug -PautoVersionCode=${{ github.run_number }} --no-daemon

      - name: APK Yukle (Dinamik Versiya Adi ile)
        uses: actions/upload-artifact@v4
        with:
          name: CanliTV-v1.${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
