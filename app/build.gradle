plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.canlitv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.canlitv.app"
        minSdk 21
        targetSdk 34
        
        // Hər yeni yığımda versiya avtomatik artır ki, silmədən üzərinə yazılsın (Update olsun)
        def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "100").toInteger() + 100
        versionCode runNumber
        versionName "1.1.${runNumber}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Çıxan faylın adını app-debug.apk yox, birbaşa tvapp.apk edir
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "tvapp.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Stabil ExoPlayer 2 kitabxanası
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'

    // OkHttp & Glide
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
