plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// GitHub Actions-dan gələn nömrə ilə versionCode və versionName avtomatik artır
def autoVersionCode = project.hasProperty('autoVersionCode') ? project.property('autoVersionCode').toInteger() : 1
def autoVersionName = "1." + autoVersionCode

android {
    namespace 'com.canlitv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.canlitv.app"
        minSdk 21
        targetSdk 34
        
        versionCode autoVersionCode
        versionName autoVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ExoPlayer video axını üçün
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    // Şəkillər və loqolar üçün Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Şəbəkə sorğuları üçün OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
