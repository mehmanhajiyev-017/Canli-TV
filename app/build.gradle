    defaultConfig {
        applicationId "com.canlitv.app"
        minSdk 21
        targetSdk 34
        
        // GitHub-da hər yığımda rəqəm avtomatik artır (məs: 100, 101, 102...)
        def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "100").toInteger() + 100
        versionCode runNumber
        versionName "1.1.${runNumber}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
